[package]
name = "ancient-world"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "x11", "wayland", "default_fonts"] }
wgpu = "24"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1
