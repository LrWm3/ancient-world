name: Model evidence
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      hardware_gpu:
        description: Run full evidence on a trusted self-hosted Vulkan GPU runner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repository_artifacts.py
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - run: python3 scripts/evidence.py --profile cpu --output output/ci-cpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-evidence
          path: output/ci-cpu
  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.hardware_gpu
    runs-on: [self-hosted, linux, vulkan-gpu]
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_repository_artifacts.py
      - run: python3 scripts/evidence.py --profile full --output output/ci-gpu-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-evidence
          path: output/ci-gpu-*
