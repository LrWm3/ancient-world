[package]
name = "economics-compute-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[features]
ancient-world-host = ["dep:ancient-world"]

[dependencies]
cubecl = { version = "=0.10.0", features = ["cpu"] }

serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ancient-world = { path = "../..", optional = true }

[[example]]
name = "host_labor_replay"
required-features = ["ancient-world-host"]

[workspace]
